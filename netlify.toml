[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Local dev only - ignored by the deploy pipeline.
# Stops `netlify dev` from launching a browser tab at localhost:8888 on every
# start; opening the app is left to whoever is running it. Set here rather
# than as a --no-open flag on the npm script so it applies however the server
# is started, including a direct `netlify dev` invocation. Verified on
# 2026-09-20 against the source of the netlify-cli installed then, rather
# than assumed: dev.js built its devConfig as
# {autoLaunch: <default>, ...config.dev, ...options} and then guarded the
# launch with `if (devConfig.autoLaunch !== false)`, so this key took
# precedence over the default. package.json allows later 17.x releases of
# the CLI, which could change that.
[dev]
  autoLaunch = false

# Path segments are forwarded as extra path parts (not query string) — Netlify's
# deployed redirect engine does not reliably rewrite named placeholders into a
# target's query string, only into the target path.
[[redirects]]
  from = "/api/case"
  to = "/.netlify/functions/case"
  status = 200

[[redirects]]
  from = "/api/trials"
  to = "/.netlify/functions/trials"
  status = 200

[[redirects]]
  from = "/api/trials/:id"
  to = "/.netlify/functions/trial/:id"
  status = 200

# The two routes that spend OpenRouter quota carry Netlify's per-IP rate
# limit. It lives here because a function written with a named `handler`
# export, as every function in this project is, has its `config` export
# ignored by Netlify's bundler, rate limit included (as read in the
# bundler's source on 2026-10-02 - see the end of
# representative-background.ts). As documented when checked that day,
# Netlify allows at most 180 seconds per window, and two rules on this
# plan - these two. The two rules count one IP's requests together, not
# separately: measured on the live site on 2026-10-06, 40 requests to the
# first route left 23 for the second before the 429s began. A full trial
# sends 7, so 60 per 3 minutes (about 8 full trials) is a backstop against
# a single source hammering them, not a limit normal use comes near; the
# site-wide call cap in db.ts is what bounds spend.
# Netlify also serves each function at its own address,
# /.netlify/functions/<name>, which no rule here covers, and the whole site
# at main--<site>.netlify.app and at an address per deploy, counting the
# limit separately on each. Each agent handler's first check refuses a
# request that arrives at the function's own address or at any address but
# the main one (see representative-background.ts), so every request they
# act on has passed this one count.
# Keep the two limits equal, so the shared count means one thing.
[[redirects]]
  from = "/api/trials/:id/representatives/:role"
  to = "/.netlify/functions/representative-background/:id/:role"
  status = 200
  [redirects.rate_limit]
    window_limit = 60
    window_size = 180
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/trials/:id/judges/:role"
  to = "/.netlify/functions/judge-background/:id/:role"
  status = 200
  [redirects.rate_limit]
    window_limit = 60
    window_size = 180
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/trials/:id/abort"
  to = "/.netlify/functions/abort/:id"
  status = 200
