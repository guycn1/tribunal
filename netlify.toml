[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Local dev only - ignored by the deploy pipeline.
# Stops `netlify dev` from launching a browser tab at localhost:8888 on every
# start; opening the app is left to whoever is running it. Set here rather
# than as a --no-open flag on the npm script so it applies however the server
# is started, including a direct `netlify dev` invocation. Verified against
# the installed CLI's own source rather than assumed: dev.js builds its
# devConfig as {autoLaunch: <default>, ...config.dev, ...options} and then
# guards the launch with `if (devConfig.autoLaunch !== false)`, so this key
# genuinely takes precedence over the default.
[dev]
  autoLaunch = false

# Path segments are forwarded as extra path parts (not query string) — Netlify's
# deployed redirect engine does not reliably rewrite named placeholders into a
# target's query string, only into the target path.
[[redirects]]
  from = "/api/case"
  to = "/.netlify/functions/case"
  status = 200

[[redirects]]
  from = "/api/trials"
  to = "/.netlify/functions/trials"
  status = 200

[[redirects]]
  from = "/api/trials/:id"
  to = "/.netlify/functions/trial/:id"
  status = 200

[[redirects]]
  from = "/api/trials/:id/representatives/:role"
  to = "/.netlify/functions/representative-background/:id/:role"
  status = 200

[[redirects]]
  from = "/api/trials/:id/judges/:role"
  to = "/.netlify/functions/judge-background/:id/:role"
  status = 200

[[redirects]]
  from = "/api/trials/:id/abort"
  to = "/.netlify/functions/abort/:id"
  status = 200
